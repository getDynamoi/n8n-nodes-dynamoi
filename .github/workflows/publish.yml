name: Publish

# Tag a release (npm run release) to publish to npm with provenance.
# npm Trusted Publishing (OIDC): no stored npm token. Configure the publisher
# on npmjs.com: repository getDynamoi/n8n-nodes-dynamoi, workflow publish.yml.
on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Trusted Publishing needs Node >= 22.14.0 and npm >= 11.5.1.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.19.1

      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"

      - name: Install
        run: npm ci

      # Lints, builds, then runs `npm publish` with provenance.
      - name: Release
        run: npm run release
